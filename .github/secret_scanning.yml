# Secret scanning exclusions.
#
# One path only. tests/fixtures/rs256-test-key.pem is a throwaway RSA keypair
# generated for the RS256/JWKS unit tests in src/auth.rs and used nowhere else:
# it authenticates to nothing and is compiled out of release builds (`cfg(test)`).
# Signature *rejection* tests need to produce real signatures, so a real key has
# to exist somewhere in the tree.
#
# Deliberately scoped to the fixture rather than to src/auth.rs — excluding a
# source file would also hide a genuine credential if one ever landed there.
paths-ignore:
  - "tests/fixtures/rs256-test-key.pem"
