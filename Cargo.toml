[package]
name = "min-mcp"
version = "0.2.0"
edition = "2021"
# MSRV: `str::floor_char_boundary` (surface/minify.rs) is the newest std API in
# use; older toolchains now fail with a clear "requires rustc 1.91" instead of a
# confusing unresolved-method error. rmcp 3 itself needs 1.88.
rust-version = "1.91"
description = "Minify your MCPs — a minifying, scope-aware proxy for MCP servers"
license = "Apache-2.0"
repository = "https://github.com/andrewgoodchild/min-mcp"
homepage = "https://github.com/andrewgoodchild/min-mcp"
documentation = "https://github.com/andrewgoodchild/min-mcp/tree/main/docs"
# Without this the crates.io page body is blank.
readme = "README.md"
keywords = ["mcp", "llm", "agent", "proxy", "openapi"]
categories = ["command-line-utilities", "network-programming", "api-bindings"]

[[bin]]
name = "minmcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# `env`: lets `--jwt` fall back to MINMCP_JWT so a caller token never has to
# sit in argv (visible to `ps` and shell history).
clap = { version = "4", features = ["derive", "env"] }
jaq-core = "1.5"
jaq-interpret = "1.5"
jaq-parse = "1.0"
jaq-std = "1.5"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Official MCP SDK — serves both agent-facing transports (behind its
# ServerHandler), while the surface, spec executor, and upstream clients stay
# hand-rolled. `server` = ServerHandler; `transport-io` = stdio();
# `transport-streamable-http-server` = the Streamable HTTP service (with SSE).
rmcp = { version = "3", default-features = false, features = [
    "server", "transport-io", "transport-streamable-http-server",
] }
# HTTP runtime to drive rmcp's StreamableHttpService (a tower service) on a
# TCP listener. Both are already in the tree via reqwest/rmcp.
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
# TLS (and mutual TLS) for the HTTP listener. rustls, tokio-rustls and ring are
# already in the tree — reqwest pulls them for outbound calls — so this adds
# wiring, not a new dependency tree. Pinned to the `ring` provider on purpose:
# rustls' default feature set is `aws_lc_rs`, which needs a C toolchain (and
# `prefer-post-quantum` drags it in), and the Windows release build has none.
# `std` brings pki-types' PEM file loading, so no rustls-pemfile either.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# The global in-flight cap is tower's own shared-semaphore layer, wrapped around
# rmcp's service. (The body cap needs no layer at all: rmcp's service enforces
# one itself as it streams the POST body, so the configured value is handed to
# it via `with_max_request_body_bytes`.)
tower = { version = "0.5", default-features = false, features = ["limit"] }
# Build the 403 body for the Origin guard in the same shape rmcp's service
# returns (BoxBody<Bytes, Infallible>). Both are already in the tree via hyper.
http-body-util = "0.1"
bytes = "1"
hyper-util = { version = "0.1", default-features = false, features = ["service", "tokio"] }
# CSPRNG for request-id generation (UUIDv4). Portable OS entropy (getrandom(2) /
# SecRandomCopyBytes / RtlGenRandom); already in the tree via rustls.
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
# preserve_order: keep JSON object keys in source order so response bodies (and
# TOON encodings) present fields as the API returned them, not alphabetized.
# arbitrary_precision: number literals round-trip byte-for-byte through `Value`.
# Without it a 128-bit id or a 20-digit decimal is silently rewritten through
# f64 on every path that parses a body (the spec envelope, `fields` projection,
# overlay `response` transforms, pagination merge).
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
# serde_yaml_ng: the maintained fork of the (archived, deprecated) serde_yaml,
# aliased to `serde_yaml` so call sites are unchanged. On the hot path — it
# parses the config and every YAML OpenAPI spec (e.g. the 42 MB MS Graph doc).
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
# rt-multi-thread: the surface is shared (Arc), not locked, so concurrent
# callers run on separate workers and one slow upstream call blocks only its own.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "io-util", "io-std", "process", "time", "sync", "net"] }
# Logging over the ecosystem-standard `tracing`; one subscriber also captures
# rmcp's own spans. Trimmed features (no ansi colours — output goes to stderr).
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }
bm25 = "2.3.2"
# `http::request::Parts` is what rmcp injects into each HTTP request's context;
# the per-request caller is attached to it. Same crate version hyper/rmcp use.
http = "1"
# Secret providers. vaultrs is the de facto Rust client for HashiCorp Vault
# (and OpenBao): KV v2 reads plus token/AppRole/Kubernetes login. `rustls-no-provider`
# so it shares the `ring` crypto provider reqwest already brings instead of adding
# aws-lc (a cmake C build on every platform). `${file:…}`/`${env:…}` need no crate.
vaultrs = { version = "0.8", default-features = false, features = ["rustls-no-provider"] }
# Resolved secrets are held as `SecretString`: no Debug/Display leak, zeroed on
# drop, and every use site says `expose_secret()` out loud.
secrecy = "0.10"

[dev-dependencies]
# Parse `minmcp inspect` JSON output and validate doc/example YAML in the
# integration tests (serde_yaml_ng parses JSON too — JSON is a subset of YAML).
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }

[profile.release]
lto = true
codegen-units = 1 # smaller, faster binary; costs release build time only
strip = true      # release artefacts don't need debug symbols
