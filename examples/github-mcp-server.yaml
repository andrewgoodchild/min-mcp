# Proxy GitHub's official MCP server — a real, public, tool-heavy server.
#
#   GITHUB_PERSONAL_ACCESS_TOKEN=ghp_... minmcp inspect --config examples/github-mcp-server.yaml
#
# Measured 2026-08-09: 85 tools → 3; ~20,822 tokens of definitions → ~424 (49×).
# Drop the GITHUB_TOOLSETS lines for its smaller default set (44 tools, 26×).
mode: three_tool
upstreams:
  - name: github
    command: docker
    args: ["run", "-i", "--rm",
           "-e", "GITHUB_PERSONAL_ACCESS_TOKEN",   # forwarded from your shell
           "-e", "GITHUB_TOOLSETS",
           "ghcr.io/github/github-mcp-server"]
    env:
      GITHUB_TOOLSETS: "all"
