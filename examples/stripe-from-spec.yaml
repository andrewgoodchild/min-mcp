# Mount Stripe's OpenAPI spec directly as an upstream (pure-Rust converter,
# no Python). base_url + auth from env (STRIPE_TEST_KEY) — no secrets in config.
mode: three_tool
upstreams:
  - name: stripe
    spec: ./stripe.json
    base_url: https://api.stripe.com
    auth_env: STRIPE_TEST_KEY
error_hints:
  - contains: '"status": 4'
    hint: "The request was rejected (4xx). Re-read the operation's schema with get_tool_details and check required fields before retrying."
