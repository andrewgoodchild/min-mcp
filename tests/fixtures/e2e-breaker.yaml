# E2E fixture: circuit breaker on a tool whose upstream is unreachable —
# every call is a deterministic transport error, so the breaker's trip
# behavior can be asserted over the wire without a network.
mode: three_tool
upstreams:
  - name: fixture
    spec: mini-openapi.json
    base_url: https://example.invalid
overlays:
  - tool: fixture.GetPing
    breaker: { consecutive_failures: 2, cooldown_s: 60 }
    timeout_s: 5   # well inside the harness's 20s read deadline
