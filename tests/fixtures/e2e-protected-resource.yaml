# Offline fixture for RFC 9728 protected-resource metadata. The HS256 secret is
# a test value; a real deployment reads it from MINMCP_JWT_SECRET.
mode: three_tool
upstreams:
  - name: acme
    spec: ../../examples/specs/acme-store.json
    base_url: https://example.invalid
auth:
  jwt_secret: "test-secret"
  protected_resource:
    resource: https://mcp.example.com/mcp
    authorization_servers: [https://idp.example.com]
