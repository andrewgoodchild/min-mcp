# TLS on the listener itself (see tests/tls_e2e.rs). Paths are relative to this
# config file.
mode: three_tool
upstreams:
  - name: fixture
    spec: mini-openapi.json
    base_url: https://example.invalid
    auth_env: CI_FIXTURE_KEY
http:
  tls:
    cert_file: tls/server.crt
    key_file: tls/server.key
